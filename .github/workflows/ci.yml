name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
        working-directory: .
      - name: Run flake8 (if available)
        run: |
          pip install flake8 || true
          if command -v flake8 &>/dev/null; then
            cd backend && flake8 . --max-line-length=120 --exclude=migrations,__pycache__ || true
          fi
      - name: Django system check
        run: python manage.py check
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          SECRET_KEY: ci-lint-key
          DEBUG: "True"
          DB_HOST: localhost
          DB_NAME: test_rf
          DB_USER: test_rf
          DB_PASSWORD: test_rf
          REDIS_URL: redis://localhost:6379/0
          REDIS_PASSWORD: ""

  backend-tests:
    runs-on: ubuntu-latest
    needs: backend-lint
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_rf
          POSTGRES_USER: test_rf
          POSTGRES_PASSWORD: test_rf
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run migrations
        run: python manage.py migrate --noinput
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          SECRET_KEY: ci-test-key
          DEBUG: "True"
          DB_HOST: localhost
          DB_NAME: test_rf
          DB_USER: test_rf
          DB_PASSWORD: test_rf
          DB_PORT: "5432"
          REDIS_URL: redis://localhost:6379/0
          REDIS_PASSWORD: ""
      - name: Run tests
        run: python manage.py test --verbosity=2
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          SECRET_KEY: ci-test-key
          DEBUG: "True"
          DB_HOST: localhost
          DB_NAME: test_rf
          DB_USER: test_rf
          DB_PASSWORD: test_rf
          DB_PORT: "5432"
          REDIS_URL: redis://localhost:6379/0
          REDIS_PASSWORD: ""

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend

  frontend-build:
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: https://example.com/api
          VITE_APP_NAME: RestaurantFlow
          VITE_WS_URL: wss://example.com

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: restaurantflow-backend:ci
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: restaurantflow-frontend:ci
          build-args: |
            VITE_API_URL=https://example.com/api
            VITE_APP_NAME=RestaurantFlow
            VITE_WS_URL=wss://example.com

  security-scan:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name != 'pull_request'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run pip-audit (non-blocking)
        run: |
          pip install pip-audit || true
          if command -v pip-audit &>/dev/null; then
            pip-audit -r backend/requirements.txt --desc || echo "::warning::pip-audit found vulnerabilities — review before production deployment"
          fi
