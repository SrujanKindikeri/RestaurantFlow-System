# =============================================================================
# RestaurantFlow — Nginx reverse proxy (production)
# Phase 23: TLS termination, rate limiting, security headers
# =============================================================================

# Rate-limiting zone: keyed per client IP, 10 MB shared memory, 30 req/min
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

upstream backend {
    server backend:8000;
}

# ---------------------------------------------------------------------------
# HTTP — redirect everything to HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
# HTTPS — primary server block
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name _;

    # TLS certificates (mount /etc/nginx/ssl/ from the host)
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Maximum request body (file uploads)
    client_max_body_size 10m;

    # -------------------------------------------------------------------------
    # Security headers
    # -------------------------------------------------------------------------
    add_header X-Frame-Options                "DENY"                                                              always;
    add_header X-Content-Type-Options         "nosniff"                                                           always;
    add_header X-XSS-Protection               "1; mode=block"                                                     always;
    add_header Referrer-Policy                "strict-origin-when-cross-origin"                                   always;
    add_header Strict-Transport-Security      "max-age=31536000; includeSubDomains; preload"                      always;
    add_header Content-Security-Policy        "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss:" always;

    # -------------------------------------------------------------------------
    # API — rate-limited
    # -------------------------------------------------------------------------
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass         http://backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # -------------------------------------------------------------------------
    # Admin — backend applies its own auth; no Nginx-level rate limit
    # -------------------------------------------------------------------------
    location /admin/ {
        proxy_pass         http://backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # -------------------------------------------------------------------------
    # WebSocket upgrade
    # -------------------------------------------------------------------------
    location /ws/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # -------------------------------------------------------------------------
    # Static files — long-lived cache
    # -------------------------------------------------------------------------
    location /static/ {
        proxy_pass  http://backend;
        expires     1y;
        add_header  Cache-Control public;
    }

    # -------------------------------------------------------------------------
    # Media files — served from named volume
    # -------------------------------------------------------------------------
    location /media/ {
        alias   /vol/media/;
        expires 7d;
    }

    # -------------------------------------------------------------------------
    # Health check — no access log noise
    # -------------------------------------------------------------------------
    location /health/ {
        proxy_pass http://backend;
        access_log off;
    }

    # -------------------------------------------------------------------------
    # SPA fallback — React app handles routing
    # -------------------------------------------------------------------------
    location / {
        root      /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        expires   -1;
    }
}
