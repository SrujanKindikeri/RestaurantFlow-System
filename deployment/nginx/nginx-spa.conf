# =============================================================================
# RestaurantFlow — Nginx SPA config (inside frontend container)
# Phase 23: Serves the compiled Vite bundle; SSL handled by the outer Nginx.
# =============================================================================

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # Compression
    # -------------------------------------------------------------------------
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript;

    # -------------------------------------------------------------------------
    # index.html — no caching (always fetch the latest entry point)
    # -------------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
        try_files $uri /index.html;
    }

    # -------------------------------------------------------------------------
    # Hashed asset bundles — immutable long cache
    # -------------------------------------------------------------------------
    location ~* \.(js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # -------------------------------------------------------------------------
    # SPA fallback — all routes handled by React Router
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
