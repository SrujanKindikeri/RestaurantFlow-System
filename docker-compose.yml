# =============================================================================
# RestaurantFlow — docker-compose.yml
# Phase 1: PostgreSQL + Redis only
# Phase 21: Security hardening — Redis password support, no insecure defaults
# Phase 23: Removed obsolete version attribute (Docker Compose v2+)
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: restaurantflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-restaurantflow}
      POSTGRES_USER: ${DB_USER:-restaurantflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-restaurantflow} -d ${DB_NAME:-restaurantflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: restaurantflow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    # Phase 21 — Redis requires a password (set via REDIS_PASSWORD env var).
    # REDIS_URL should include the password: redis://:password@localhost:6379/0
    command: >
      sh -c "redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
